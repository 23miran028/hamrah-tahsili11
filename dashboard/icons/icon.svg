<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1e3a"/>
      <stop offset="1" stop-color="#06152b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#268fe5"/>
      <stop offset="1" stop-color="#54c8ff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(96 96)">
    <rect x="0"   y="0"   width="96" height="96" rx="18" fill="url(#accent)"/>
    <rect x="128" y="0"   width="96" height="96" rx="18" fill="url(#accent)"/>
    <rect x="256" y="0"   width="96" height="96" rx="18" fill="url(#accent)" opacity="0.55"/>

    <rect x="0"   y="128" width="96" height="96" rx="18" fill="url(#accent)"/>
    <rect x="128" y="128" width="96" height="96" rx="18" fill="url(#accent)"/>
    <rect x="256" y="128" width="96" height="96" rx="18" fill="url(#accent)" opacity="0.55"/>

    <rect x="0"   y="256" width="96" height="96" rx="18" fill="url(#accent)" opacity="0.55"/>
    <rect x="128" y="256" width="96" height="96" rx="18" fill="url(#accent)" opacity="0.55"/>
    <rect x="256" y="256" width="96" height="96" rx="18" fill="url(#accent)" opacity="0.25"/>
  </g>
</svg>